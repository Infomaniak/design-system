<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --lint-bg: var(--figma-color-bg, #ffffff);
        --lint-text: var(--figma-color-text, #1a1a1a);
        --lint-text-secondary: var(--figma-color-text-secondary, #666666);
        --lint-border: var(--figma-color-border, #e0e0e0);
        --lint-danger: var(--figma-color-text-danger, #d64747);
        --lint-warning: var(--figma-color-text-warning, #b8860b);
        --lint-accent: var(--figma-color-brand-secondary, #0c8ce9);
      }

      body {
        margin: 0;
        background: var(--lint-bg);
        color: var(--lint-text);
        font-family: Inter, system-ui, sans-serif;
        font-size: 11px;
        line-height: 1.4;
      }

      .panel {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
      }

      .title {
        margin: 0;
        font-size: 12px;
        font-weight: 600;
      }

      .hint,
      .progress-text,
      .counts {
        margin: 0;
        color: var(--lint-text-secondary);
      }

      .error {
        margin: 0;
        color: var(--lint-danger);
      }

      .success {
        margin: 0;
        font-weight: 500;
      }

      .cancelled {
        margin: 0;
        color: var(--lint-warning);
        font-style: italic;
      }

      .button {
        padding: 7px 10px;
        border: 1px solid var(--lint-border);
        border-radius: 6px;
        background: transparent;
        color: var(--lint-text);
        font: inherit;
        cursor: pointer;
      }

      .button.primary {
        background: var(--figma-color-bg-brand, #0d99ff);
        border-color: transparent;
        color: #ffffff;
      }

      .actions {
        display: flex;
        gap: 8px;
      }

      .actions .button {
        flex: 1;
      }

      .progress-track {
        height: 4px;
        border-radius: 2px;
        background: var(--lint-border);
        overflow: hidden;
      }

      .progress-bar {
        height: 100%;
        background: var(--figma-color-bg-brand, #0d99ff);
        transition: width 0.15s ease;
      }

      .progress-bar.indeterminate {
        width: 35%;
        animation: lint-indeterminate 1.1s ease-in-out infinite;
      }

      @keyframes lint-indeterminate {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(300%);
        }
      }

      .progress-text {
        animation: lint-pulse 1.2s ease-in-out infinite;
      }

      @keyframes lint-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }

      .panel.refreshed {
        animation: lint-refresh 0.25s ease-out;
      }

      @keyframes lint-refresh {
        from {
          opacity: 0.35;
        }
        to {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .progress-bar.indeterminate,
        .progress-text,
        .panel.refreshed {
          animation: none;
        }
      }

      .findings {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .finding {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 6px 8px;
        border: 1px solid var(--lint-border);
        border-left-width: 3px;
        border-radius: 6px;
        background: transparent;
        color: var(--lint-text);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .finding.error {
        border-left-color: var(--lint-danger);
      }

      .finding.warning {
        border-left-color: var(--lint-warning);
      }

      .finding-rule {
        font-weight: 600;
      }

      .finding-detail {
        color: var(--lint-text-secondary);
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!--FIGMA_LINT_UI_BUNDLE-->
  </body>
</html>
