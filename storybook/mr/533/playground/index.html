<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>ESDS Playground</title>
    <link
      rel="stylesheet"
      href="https://fonts.storage.infomaniak.com/design-system/latest/infomaniak-sans.min.css"
    />
    <script type="module" crossorigin src="./assets/index-DaAxQqW4.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-ac8o2xH6.css">
  </head>
  <body>
    <header class="app-bar">
      <h1>ESDS Playground</h1>
      <button
        class="ui-button"
        id="copy-link"
        type="button"
      >
        Copy link
      </button>
      <button
        class="ui-button"
        id="reset"
        type="button"
      >
        Reset
      </button>
    </header>
    <main class="playground">
      <playground-project id="project"></playground-project>
      <playground-tab-bar
        project="project"
        editor="file-editor"
      ></playground-tab-bar>
      <playground-file-editor
        id="file-editor"
        project="project"
      ></playground-file-editor>
      <playground-preview project="project"></playground-preview>
    </main>
  </body>
</html>
