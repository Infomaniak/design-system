name: Build and Deploy Storybook on PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

concurrency:
  group: gh-pages-deployment
  cancel-in-progress: false

jobs:
  build-storybook-pr:
    name: Build Storybook (PR)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      should_build: ${{ steps.storybook.outputs.should_build }}
      public_url: ${{ steps.storybook.outputs.public_url }}

    steps:
      - name: Build and deploy Storybook (PR preview)
        id: storybook
        uses: ./.github/actions/build-deploy-storybook
        with:
          kchat_webhook_id: ${{ secrets.KCHAT_WEBHOOK_ID }}

  visual-regression:
    name: Visual Regression
    needs: [build-storybook-pr]
    if: github.event_name == 'pull_request' && needs.build-storybook-pr.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Wait for PR Storybook deployment
        run: |
          url="${{ needs.build-storybook-pr.outputs.public_url }}/index.json"
          echo "Waiting for Storybook deployment to be reachable at $url"
          timeout=180
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo "000")
            if [ "$status" = "200" ]; then
              echo "Storybook deployment is reachable (HTTP $status after ${elapsed}s)."
              exit 0
            fi
            echo "  -> HTTP $status, retrying in 10s..."
            sleep 10
            elapsed=$((elapsed + 10))
          done
          echo "::error::PR Storybook deployment not reachable at $url after ${timeout}s. Check the 'Build Storybook (PR)' job."
          exit 1

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run visual regression tests
        id: vrt
        run: yarn test:vrt
        env:
          VR_STORYBOOK_URL: ${{ needs.build-storybook-pr.outputs.public_url }}
          VR_DEVELOP_URL: https://infomaniak.github.io/design-system/storybook/develop
        continue-on-error: true

      - name: Upload HTML report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-report-${{ github.event.pull_request.number }}
          path: playwright-vr-report/
          retention-days: 3
          if-no-files-found: warn

      - name: Post/Update PR comment
        if: always()
        run: yarn ci:visual-regression --mode=comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VR_REPORT_PATH: playwright-vr-results.json
          VR_METADATA_PATH: playwright-vr-results-metadata.json
          VR_ARTIFACT_NAME: visual-regression-report-${{ github.event.pull_request.number }}
          VR_ARTIFACT_RETENTION_DAYS: '3'
