name: Build and Deploy Storybook

on:
  push:
    branches:
      - main
      - develop
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: gh-pages-deployment
  cancel-in-progress: false

jobs:
  build-storybook:
    name: Build Storybook (branches/tags)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build and deploy Storybook
        id: storybook
        uses: ./.github/actions/build-deploy-storybook
        with:
          iconify_api_url: ${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && 'https://iconify.infomaniak.com/' || 'https://iconify.preprod.dev.infomaniak.ch/' }}
          fonts_css_url: ${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && 'https://fonts.storage.infomaniak.com/design-system/latest/infomaniak-sans.min.css' || 'https://fonts.storage.infomaniak.com/design-system/dev/infomaniak-sans.min.css' }}
          kchat_webhook_id: ${{ secrets.KCHAT_WEBHOOK_ID }}
