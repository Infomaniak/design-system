name: Check PR code quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  check-pr-code-quality:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify custom-elements.json can be generated
        run: |
          cd packages/components
          yarn analyze:cem
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('custom-elements.json', 'utf8'));
            if (!data.schemaVersion) throw new Error('Missing schemaVersion');
            if (!data.modules || data.modules.length === 0) throw new Error('No modules found');
            console.log(`✅ CEM generated successfully with ${data.modules.length} modules`);
          "
      - name: Build packages
        run: yarn build

      - name: Run "check" script
        run: yarn run check

      - name: Run "test" script
        # TODO add support for coverage with PR feedback
        run: yarn run test
