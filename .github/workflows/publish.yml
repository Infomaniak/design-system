name: Publish Packages

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          always-auth: true
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Publish missing package versions
        if: >-
          ${{
            github.event_name == 'push' ||
            (github.event_name == 'pull_request' &&
             github.event.pull_request.head.repo.full_name == github.repository &&
             contains(github.event.pull_request.labels.*.name, 'dev'))
          }}
        run: yarn ci:publish
        env:
          CI_PUBLISH_CONFIG: |
            {
              "targetBranch": "${{ github.event_name == 'pull_request' ? github.base_ref : github.ref_name }}",
              "prLabels": ${{ github.event_name == 'pull_request' ? toJson(github.event.pull_request.labels.*.name) : '[]' }}
            }
          NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
