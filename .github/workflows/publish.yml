name: Publish Packages

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # for OIDC
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_DEPLOY_KEY_IOS" > ~/.ssh/id_ed25519_ios
          echo "$SSH_DEPLOY_KEY_ANDROID" > ~/.ssh/id_ed25519_android
          chmod 600 ~/.ssh/id_ed25519_ios
          chmod 600 ~/.ssh/id_ed25519_android
          ssh-keyscan github.com >> ~/.ssh/known_hosts

          cat > ~/.ssh/config << EOF
          # Host name should always match the github repository one
          Host ios-design-system
            HostName github.com
            User git
            IdentityFile ~/.ssh/id_ed25519_ios
            IdentitiesOnly yes

          # Host name should always match the github repository one
          Host android-design-system
            HostName github.com
            User git
            IdentityFile ~/.ssh/id_ed25519_android
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config
        env:
          SSH_DEPLOY_KEY_IOS: ${{ secrets.SSH_DEPLOY_KEY_IOS }}
          SSH_DEPLOY_KEY_ANDROID: ${{ secrets.SSH_DEPLOY_KEY_ANDROID }}

      # Context: https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#signing-commits-in-a-workflow
      # Link: https://github.com/crazy-max/ghaction-import-gpg/releases
      - name: Import bot's GPG key for signing commits
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        with:
          gpg_private_key: ${{ secrets.BOT_MOBILE_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.BOT_MOBILE_GPG_PASSPHRASE }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Configure git user
        run: |
          git config --global user.name "dev-mobile-bot"
          git config --global user.email "mobile+github-bot@infomaniak-dev.ch"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run changeset version
        run: yarn changeset:version

      - name: Commit and push version bump
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'develop' &&
          github.event.action == 'ready_for_review'
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: version packages via changesets"
            git push
          fi

      - name: Publish missing package versions
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           contains(github.event.pull_request.labels.*.name, 'dev'))
        run: yarn ci:publish
        env:
          GITHUB_CI_CONFIG: ${{ toJson(github) }}
          KCHAT_WEBHOOK_ID: ${{ secrets.KCHAT_WEBHOOK_ID }}
          CI_PULL_REQUEST_AUTH_TOKEN_MOBILE: ${{ secrets.CI_PULL_REQUEST_AUTH_TOKEN_MOBILE }}

      - name: Publish missing package versions (dry-run for fork PR)
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          contains(github.event.pull_request.labels.*.name, 'dev')
        run: yarn ci:publish
        env:
          GITHUB_CI_CONFIG: ${{ toJson(github) }}
          CI_PUBLISH_DRY_RUN: 'true'
          SHOULD_NOTIFY: 'false'
