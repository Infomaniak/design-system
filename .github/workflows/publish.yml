name: Publish Packages

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sf-symbols-changes:
    name: Detect SF Symbols changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name != 'pull_request'

    outputs:
      sf_symbols: ${{ steps.filter.outputs.sf_symbols || steps.dispatch.outputs.sf_symbols }}

    steps:
      - name: Checkout repository
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # dorny/paths-filter requires full history on push events
          persist-credentials: false

      - name: Detect changed paths
        if: github.event_name == 'push'
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            sf_symbols:
              - 'packages/assets/images/svg/**'

      - name: Force publish on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        id: dispatch
        run: echo 'sf_symbols=true' >> "$GITHUB_OUTPUT"

  publish:
    name: Publish
    # yarn ci:publish only supports "push" and "pull_request" events
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # for OIDC
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      # Mise is required by the iOS workflow
      - name: Setup mise
        uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8
        with:
          install: false

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_DEPLOY_KEY_IOS" > ~/.ssh/id_ed25519_ios
          echo "$SSH_DEPLOY_KEY_ANDROID" > ~/.ssh/id_ed25519_android
          chmod 600 ~/.ssh/id_ed25519_ios
          chmod 600 ~/.ssh/id_ed25519_android
          ssh-keyscan github.com >> ~/.ssh/known_hosts

          cat > ~/.ssh/config << EOF
          # Host name should always match the github repository one
          Host ios-design-system
            HostName github.com
            User git
            IdentityFile ~/.ssh/id_ed25519_ios
            IdentitiesOnly yes

          # Host name should always match the github repository one
          Host android-design-system
            HostName github.com
            User git
            IdentityFile ~/.ssh/id_ed25519_android
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config
        env:
          SSH_DEPLOY_KEY_IOS: ${{ secrets.SSH_DEPLOY_KEY_IOS }}
          SSH_DEPLOY_KEY_ANDROID: ${{ secrets.SSH_DEPLOY_KEY_ANDROID }}

      # Context: https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#signing-commits-in-a-workflow
      # Link: https://github.com/crazy-max/ghaction-import-gpg/releases
      - name: Import bot's GPG key for signing commits
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        with:
          gpg_private_key: ${{ secrets.INFOMANIAK_BOT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.INFOMANIAK_BOT_GPG_PASSPHRASE }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Configure git user
        run: |
          git config --global user.name "${{ vars.INFOMANIAK_BOT_USERNAME }}"
          git config --global user.email "${{ vars.INFOMANIAK_BOT_EMAIL }}"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run changeset version
        run: |
          yarn changeset:version
          git add -A
          git commit --allow-empty -m "chore: version packages via changesets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push CHANGELOG
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'develop' &&
          github.event.action == 'ready_for_review'
        run: |
          git remote set-url origin "https://x-access-token:${INFOMANIAK_BOT_PAT}@github.com/${{ github.repository }}.git"
          git push origin HEAD:develop
        env:
          INFOMANIAK_BOT_PAT: ${{ secrets.INFOMANIAK_BOT_PAT }}

      - name: Publish missing package versions
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           contains(github.event.pull_request.labels.*.name, 'dev'))
        run: yarn ci:publish
        env:
          GITHUB_CI_CONFIG: ${{ toJson(github) }}
          KCHAT_WEBHOOK_ID: ${{ secrets.KCHAT_WEBHOOK_ID }}
          CI_PULL_REQUEST_AUTH_TOKEN_MOBILE: ${{ secrets.CI_PULL_REQUEST_AUTH_TOKEN_MOBILE }}

      - name: Publish missing package versions (dry-run for fork PR)
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          contains(github.event.pull_request.labels.*.name, 'dev')
        run: yarn ci:publish
        env:
          GITHUB_CI_CONFIG: ${{ toJson(github) }}
          CI_PUBLISH_DRY_RUN: 'true'
          SHOULD_NOTIFY: 'false'

  publish-sf-symbols:
    name: Publish SF Symbols
    needs: sf-symbols-changes
    if: needs.sf-symbols-changes.outputs.sf_symbols == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: publish-sf-symbols-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_DEPLOY_KEY_IOS" > ~/.ssh/id_ed25519_ios
          chmod 600 ~/.ssh/id_ed25519_ios
          ssh-keyscan github.com >> ~/.ssh/known_hosts

          cat > ~/.ssh/config << EOF
          # Host name should always match the github repository one
          Host ios-design-system
            HostName github.com
            User git
            IdentityFile ~/.ssh/id_ed25519_ios
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config
        env:
          SSH_DEPLOY_KEY_IOS: ${{ secrets.SSH_DEPLOY_KEY_IOS }}

      - name: Compute publish config
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo 'PUBLISH_CONFIG={"mode":"prod"}' >> "$GITHUB_ENV"
          else
            echo "PUBLISH_CONFIG={\"mode\":\"rc\",\"prerelease\":\"$GITHUB_RUN_ID\"}" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: yarn install --immutable

      - name: Publish SF Symbols to ios-design-system
        run: yarn workspace @infomaniak-design-system/svg-assets publish:sf-symbols
        env:
          CI_PULL_REQUEST_AUTH_TOKEN_MOBILE: ${{ secrets.CI_PULL_REQUEST_AUTH_TOKEN_MOBILE }}
          KCHAT_WEBHOOK_ID: ${{ secrets.KCHAT_WEBHOOK_ID }}
