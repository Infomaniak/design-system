name: On Figma event

on:
  workflow_dispatch:
    inputs:
      event:
        description: 'Figma WebhookV2 Event'
        required: true
        type: string

jobs:
  on-figma-event:
    name: On Figma event
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: develop

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run ci:figma-event
        run: yarn ci:figma-event
        env:
          FIGMA_WEBHOOK_EVENT: ${{ inputs.event }}
          CI_DS_UPDATE_AND_PR_AUTH_TOKEN: ${{ secrets.CI_DS_UPDATE_AND_PR_AUTH_TOKEN }}
          FIGMA_API_TOKEN: ${{ secrets.FIGMA_API_TOKEN }}
          FIGMA_ICON_FILE_KEY: ${{ secrets.FIGMA_ICON_FILE_KEY }}
          KCHAT_WEBHOOK_ID: ${{ secrets.KCHAT_WEBHOOK_ID }}
