name: On Figma event

on:
  workflow_dispatch:
    inputs:
      event:
        description: 'Figma WebhookV2 Event'
        required: true
        type: string

jobs:
  on-figma-event:
    name: On Figma event
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate and mask passcode
        run: |
          # Extract passcode                                                                                             
            PASSCODE=$(echo '${{ inputs.event }}' | jq -r '.passcode')                                                     
            
            # Mask it for subsequent logs                                                                                  
            echo "::add-mask::$PASSCODE"                                                                                   
            
            # Validate against expected value                                                                              
            if [ "$PASSCODE" != "${{ secrets.FIGMA_EVENT_PASSCODE }}" ]; then                                            
              echo "::error::Invalid passcode"                                                                             
              exit 1                                                                                                       
            fi                                                                                                             
            
            # Remove passcode from event before storing in env                                                             
            CLEAN_EVENT=$(echo '${{ inputs.event }}' | jq 'del(.passcode)')                                                
            echo "FIGMA_EVENT=$CLEAN_EVENT" >> "$GITHUB_ENV" 

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          always-auth: true
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run ci:figma-event
        run: yarn ci:figma-event
        env:
          CI_PULL_REQUEST_AUTH_TOKEN_DESIGN_SYSTEM: ${{ secrets.CI_PULL_REQUEST_AUTH_TOKEN_DESIGN_SYSTEM }}
          FIGMA_API_TOKEN: ${{ secrets.FIGMA_API_TOKEN }}
          FIGMA_ICON_FILE_KEY: ${{ secrets.FIGMA_ICON_FILE_KEY }}
          KCHAT_WEBHOOK_ID: ${{ secrets.KCHAT_WEBHOOK_ID }}
