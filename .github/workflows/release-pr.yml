name: Release PR

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
    types:
      - ready_for_review

jobs:
  ensure-release-pr:
    name: Ensure release PR exists
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create release PR if none exists
        run: |
          EXISTING=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number')
          if [ -z "$EXISTING" ]; then
            gh pr create \
              --base main \
              --head develop \
              --title "release: develop → main" \
              --body "$(cat <<'EOF'
          Merge this PR to release accumulated changes from `develop` to `main`.

          Mark this PR as **Ready for review** to trigger automatic version bumping and changelog generation via changesets.
          EOF
          )" \
              --draft
          else
            echo "Release PR #$EXISTING already exists"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  version-bump:
    name: Version bump via changesets
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'develop' && github.event.action == 'ready_for_review'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run changeset version
        run: yarn changeset:version

      - name: Validate
        run: |
          yarn build
          yarn run check
          yarn run test

      - name: Create signed commit via GitHub API
        uses: actions/github-script@v9
        with:
          script: |
            const { exec: execChild } = require('child_process');
            const { promisify } = require('util');
            const execAsync = promisify(execChild);
            
            // Check for changes
            const { stdout: gitStatus } = await execAsync('git status --porcelain');
            if (!gitStatus.trim()) {
              core.info('No changes to commit');
              return;
            }
            
            // Stage all changes
            await execAsync('git add -A');
            
            // Get current HEAD (parent commit)
            const { stdout: parentSha } = await execAsync('git rev-parse HEAD');
            
            // Create tree from staged changes (local operation)
            const { stdout: treeSha } = await execAsync('git write-tree');
            
            // Create commit via GitHub API (auto-signed by GitHub)
            const { data: commit } = await github.rest.git.createCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              message: 'chore: version packages via changesets',
              tree: treeSha.trim(),
              parents: [parentSha.trim()],
              author: {
                name: 'github-actions[bot]',
                email: '41898282+github-actions[bot]@users.noreply.github.com'
              },
              committer: {
                name: 'github-actions[bot]',
                email: '41898282+github-actions[bot]@users.noreply.github.com'
              }
            });
            
            core.info(`Created signed commit ${commit.sha}`);
            
            // Update branch reference (push to develop)
            await github.rest.git.updateRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/develop',
              sha: commit.sha
            });
            
            core.info('Successfully pushed signed commit to develop branch');
