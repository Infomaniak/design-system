name: Release PR

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
    types:
      - ready_for_review

jobs:
  ensure-release-pr:
    name: Ensure release PR exists
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create release PR if none exists
        run: |
          EXISTING=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number')
          if [ -z "$EXISTING" ]; then
            gh pr create \
              --base main \
              --head develop \
              --title "release: develop → main" \
              --body "$(cat <<'EOF'
          Merge this PR to release accumulated changes from `develop` to `main`.

          Mark this PR as **Ready for review** to trigger automatic version bumping and changelog generation via changesets.
          EOF
          )" \
              --draft
          else
            echo "Release PR #$EXISTING already exists"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  version-bump:
    name: Version bump via changesets
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'develop' && github.event.action == 'ready_for_review'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run changeset version
        run: yarn changeset:version

      - name: Validate
        run: |
          yarn build
          yarn run check
          yarn run test

      # Context: https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#signing-commits-in-a-workflow
      # Link: https://github.com/crazy-max/ghaction-import-gpg/releases
      - name: Import bot's GPG key for signing commits
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        with:
          gpg_private_key: ${{ secrets.BOT_MOBILE_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.BOT_MOBILE_GPG_PASSPHRASE }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Configure git user
        run: |
          git config --global user.name "dev-mobile-bot"
          git config --global user.email "mobile+github-bot@infomaniak-dev.ch"

      - name: Commit and push version bump
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: version packages via changesets"
            git push
          fi
